<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셈책</title>
<style>
:root { --bg: #FAF8F3; --text: #1F2430; --sub: #5A6070; --line: #E3DED3; --accent: #33415F; }
@media (prefers-color-scheme: dark) { :root { --bg: #171A21; --text: #E6E8EE; --sub: #A3A9B6; --line: #2C313C; --accent: #B9C7E6; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; color: var(--accent); }
h2 { font-size: 1.1rem; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
p { color: var(--sub); margin: 0 0 8px; }
ul { padding-left: 1.2em; margin: 0; }
li { margin: 6px 0; word-break: keep-all; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<h1>셈책</h1>
<p>직접 쓰는 가계부 · Sangaji Studio</p>
<ul><li><a href="privacy/">개인정보처리방침</a></li></ul>
</main>
</body>
</html>
